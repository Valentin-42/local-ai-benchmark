# git-cliff configuration — https://git-cliff.org/docs/configuration
# Commits follow Conventional Commits: <type>(<scope>): <description>
# Generate: git cliff -o CHANGELOG.md        (unreleased: git cliff --unreleased)

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Automated benchmark result commits pushed by the VMs: kept out of the changelog.
  { message = "^chore\\(results\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
  { message = "^chore|^style", group = "<!-- 7 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
]
