# Models to benchmark. All served through llama.cpp with GGUF weights so that
# CPU and GPU machines run the *same* artifact and results are comparable.
#
# size_gb  : size of the GGUF file (used to skip models that don't fit)
# tags     : select subsets with `--tags` (e.g. `smoke` for a quick local test)
#
# File URLs were checked against huggingface.co on 2026-10-30.

models:
  - id: qwen2.5-0.5b-q4
    repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
    file: qwen2.5-0.5b-instruct-q4_k_m.gguf
    size_gb: 0.5
    tags: [smoke]

  - id: llama3.1-8b-q4
    repo: bartowski/Meta-Llama-3.1-8B-Instruct-GGUF
    file: Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf
    size_gb: 4.9
    tags: [small, default]

  - id: qwen3-8b-q4
    repo: Qwen/Qwen3-8B-GGUF
    file: Qwen3-8B-Q4_K_M.gguf
    size_gb: 5.0
    tags: [small, default]

  - id: gemma3-12b-q4
    repo: ggml-org/gemma-3-12b-it-GGUF
    file: gemma-3-12b-it-Q4_K_M.gguf
    size_gb: 7.3
    tags: [medium, default]

  - id: gpt-oss-20b-mxfp4
    repo: ggml-org/gpt-oss-20b-GGUF
    file: gpt-oss-20b-MXFP4.gguf
    size_gb: 12.1
    tags: [medium, default]

  - id: mistral-small-24b-q4
    repo: bartowski/Mistral-Small-24B-Instruct-2501-GGUF
    file: Mistral-Small-24B-Instruct-2501-Q4_K_M.gguf
    size_gb: 14.3
    tags: [medium, default]

  - id: qwen3-30b-a3b-q4          # MoE: 30B total, 3B active -> fast on CPU
    repo: Qwen/Qwen3-30B-A3B-GGUF
    file: Qwen3-30B-A3B-Q4_K_M.gguf
    size_gb: 18.6
    tags: [large, default]

  - id: llama3.3-70b-q4
    repo: bartowski/Llama-3.3-70B-Instruct-GGUF
    file: Llama-3.3-70B-Instruct-Q4_K_M.gguf
    size_gb: 42.5
    tags: [large]
